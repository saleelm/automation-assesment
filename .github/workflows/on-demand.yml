name: On-Demand Test Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - preprod
          - dev
      platform:
        description: 'Execution Platform'
        required: true
        default: 'web'
        type: choice
        options:
          - web
      marker:
        description: 'Pytest marker expression (e.g. smoke, sanity, shop, webgl)'
        required: false
        default: 'sanity'

permissions:
  contents: read

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run Lint and Static Checks
        run: |
          make lint
          make typecheck

      - name: Execute Tests
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          pytest --platform ${{ github.event.inputs.platform }} -m "${{ github.event.inputs.marker }}" --alluredir=allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: allure-results
